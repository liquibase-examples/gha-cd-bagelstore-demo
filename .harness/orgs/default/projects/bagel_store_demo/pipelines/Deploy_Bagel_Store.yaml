pipeline:
  name: Deploy Bagel Store
  identifier: Deploy_Bagel_Store
  projectIdentifier: bagel_store_demo
  orgIdentifier: default
  tags:
    demo_id: <+env.variables.demo_id>
    deployment_type: coordinated_db_app
  variables:
    - name: VERSION
      type: String
      description: Git tag version (e.g., v1.0.0)
      required: true
      value: <+input>
    - name: GITHUB_ORG
      type: String
      description: GitHub organization name
      required: true
      value: <+input>
    - name: DEPLOYMENT_TARGET
      type: String
      description: Deployment target (aws or local)
      required: true
      value: <+input>
  stages:
    - stage:
        name: Deploy to Dev
        identifier: Deploy_to_Dev
        description: Automatically deploy database and application to dev environment
        type: Deployment
        tags:
          environment: dev
        spec:
          deploymentType: CustomDeployment
          service:
            serviceRef: bagel_store
          environment:
            environmentRef: psr_dev
            infrastructureDefinitions:
              - identifier: psr_dev_infra
          execution:
            steps:
              - stepGroup:
                  name: Coordinated DB and App Deployment
                  identifier: Coordinated_Deployment
                  template:
                    templateRef: Coordinated_DB_App_Deployment
                    versionLabel: v1.0
            rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
        when:
          pipelineStatus: Success
    - stage:
        name: Deploy to Test
        identifier: Deploy_to_Test
        description: Deploy database and application to test environment (requires approval)
        type: Deployment
        tags:
          environment: test
        spec:
          deploymentType: CustomDeployment
          service:
            useFromStage:
              stage: Deploy_to_Dev
          environment:
            environmentRef: psr_test
            infrastructureDefinitions:
              - identifier: psr_test_infra
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Test Deployment
                  identifier: Approve_Test_Deployment
                  spec:
                    approvalMessage: |-
                      Please review and approve deployment to TEST environment.

                      Version: <+pipeline.variables.VERSION>
                      Demo ID: <+env.variables.demo_id>

                      Changes will be applied to test database and application.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
                  timeout: 1d
              - stepGroup:
                  name: Coordinated DB and App Deployment
                  identifier: Coordinated_Deployment
                  template:
                    templateRef: Coordinated_DB_App_Deployment
                    versionLabel: v1.0
            rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
        when:
          pipelineStatus: Success
    - stage:
        name: Deploy to Staging
        identifier: Deploy_to_Staging
        description: Deploy database and application to staging environment (requires approval)
        type: Deployment
        tags:
          environment: staging
        spec:
          deploymentType: CustomDeployment
          service:
            useFromStage:
              stage: Deploy_to_Dev
          environment:
            environmentRef: psr_staging
            infrastructureDefinitions:
              - identifier: psr_staging_infra
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Staging Deployment
                  identifier: Approve_Staging_Deployment
                  spec:
                    approvalMessage: |-
                      Please review and approve deployment to STAGING environment.

                      Version: <+pipeline.variables.VERSION>
                      Demo ID: <+env.variables.demo_id>

                      This is the final pre-production environment.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
                  timeout: 1d
              - stepGroup:
                  name: Coordinated DB and App Deployment
                  identifier: Coordinated_Deployment
                  template:
                    templateRef: Coordinated_DB_App_Deployment
                    versionLabel: v1.0
            rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
        when:
          pipelineStatus: Success
    - stage:
        name: Deploy to Production
        identifier: Deploy_to_Production
        description: Deploy database and application to production environment (requires approval)
        type: Deployment
        tags:
          environment: prod
        spec:
          deploymentType: CustomDeployment
          service:
            useFromStage:
              stage: Deploy_to_Dev
          environment:
            environmentRef: psr_prod
            infrastructureDefinitions:
              - identifier: psr_prod_infra
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve Production Deployment
                  identifier: Approve_Production_Deployment
                  spec:
                    approvalMessage: |-
                      ⚠️ PRODUCTION DEPLOYMENT

                      Please carefully review before approving deployment to PRODUCTION.

                      Version: <+pipeline.variables.VERSION>
                      Demo ID: <+env.variables.demo_id>

                      This will apply database changes and deploy to production environment.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account._account_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
                  timeout: 1d
              - stepGroup:
                  name: Coordinated DB and App Deployment
                  identifier: Coordinated_Deployment
                  template:
                    templateRef: Coordinated_DB_App_Deployment
                    versionLabel: v1.0
            rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
        when:
          pipelineStatus: Success
  allowStageExecutions: true
