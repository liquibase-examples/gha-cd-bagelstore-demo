inputSet:
  name: Rollback
  identifier: Rollback
  orgIdentifier: default
  projectIdentifier: bagel_store_demo
  pipeline:
    identifier: Deploy_Bagel_Store
    variables:
      - name: VERSION
        type: String
        value: <+input>
      - name: GITHUB_ORG
        type: String
        value: liquibase-examples
      - name: DEPLOYMENT_TARGET
        type: String
        value: aws
      - name: ROLLBACK
        type: String
        value: "true"
      - name: ROLLBACK_TO_VERSION
        type: String
        value: <+input>
